name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AZURITE_ACCOUNT: devstoreaccount1
  AZURITE_KEY: "Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw=="
  TEST_UPLOAD_DIR: /tmp/test-upload-dir

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Generate test data
        run: .github/resources/generate-test-data.sh "$TEST_UPLOAD_DIR"

      - name: Setup Azurite with HTTPS
        run: .github/resources/setup-azurite.sh

      - name: Create test containers
        run: .github/resources/create-containers.sh test-sharedkey test-anon

      # ── Test 1: SharedKey authentication ─────────────────────────────
      - name: "Test: Upload with SharedKey credential"
        uses: ./
        with:
          account: ${{ env.AZURITE_ACCOUNT }}
          container: test-sharedkey
          directory: ${{ env.TEST_UPLOAD_DIR }}
        env:
          AZURE_ACCOUNT_KEY: ${{ env.AZURITE_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: "Verify: SharedKey uploads"
        run: .github/resources/verify-sharedkey-uploads.sh test-sharedkey "$TEST_UPLOAD_DIR"

      # ── Test 2: Anonymous credential (should fail) ───────────────────
      - name: "Test: Upload with Anonymous credential (expect failure)"
        id: anon-upload
        continue-on-error: true
        uses: ./
        with:
          account: ${{ env.AZURITE_ACCOUNT }}
          container: test-anon
          directory: ${{ env.TEST_UPLOAD_DIR }}
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          # No AZURE_ACCOUNT_KEY → action falls back to AnonymousCredential

      - name: "Verify: Anonymous upload was rejected"
        run: .github/resources/verify-anon-upload.sh "${{ steps.anon-upload.outcome }}"
