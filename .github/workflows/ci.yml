name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AZURITE_ACCOUNT: storage_account
  AZURITE_KEY: "c3RvcmFnZV9rZXk="
  TEST_UPLOAD_DIR: /tmp/test-upload-dir

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Setup
        run: .github/resources/azurite-test.sh setup "$TEST_UPLOAD_DIR"

      - name: "SharedKeyCredential: Upload"
        uses: ./
        with:
          account: ${{ env.AZURITE_ACCOUNT }}
          container: container-sharedkey
          directory: ${{ env.TEST_UPLOAD_DIR }}
        env:
          AZURE_ACCOUNT_KEY: ${{ env.AZURITE_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: "SharedKeyCredential: Verify"
        run: .github/resources/azurite-test.sh verify-sharedkey container-sharedkey "$TEST_UPLOAD_DIR"

      - name: "AnonymousCredential: Upload (expect failure)"
        id: anonymous-upload
        continue-on-error: true
        uses: ./
        with:
          account: ${{ env.AZURITE_ACCOUNT }}
          container: test-anonymous
          directory: ${{ env.TEST_UPLOAD_DIR }}
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

      - name: "AnonymousCredential: Verify"
        run: .github/resources/azurite-test.sh verify-anonymous "${{ steps.anonymous-upload.outcome }}"
